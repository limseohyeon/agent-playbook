name: Update README index

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update from main
        run: git pull --rebase origin main

      - name: Generate README index
        run: python .github/scripts/generate_readme_index.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README index"
          git push origin HEAD:main
