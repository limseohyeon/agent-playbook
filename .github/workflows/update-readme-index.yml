name: Validate playbook

on:
  pull_request:
    paths:
      - "agents/**"
      - "skills/**"
      - "rules/**"
      - "prompts/**"
      - "translations/**"
      - "README.md"
      - ".github/scripts/**"
      - ".github/workflows/update-readme-index.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-playbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-playbook:
    name: Validate artifacts, translations, and README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generated index
        run: python .github/scripts/generate_readme_index.py --check
